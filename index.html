<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOGE Network | Official Ecosystem</title>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f3ba2f;
            --dark-bg: #0b0e11;
            --card-bg: #1e2329;
            --text-gray: #848e9c;
        }

        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hero-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(243, 186, 47, 0.1);
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(243, 186, 47, 0.3));
        }

        h1 {
            font-size: 28px;
            margin: 10px 0;
            color: var(--primary-gold);
            letter-spacing: 1px;
        }

        .tagline {
            color: var(--text-gray);
            font-size: 16px;
            margin-bottom: 30px;
        }

        .contract-box {
            background: #0b0e11;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed var(--primary-gold);
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .contract-box:hover {
            background: #161a1e;
        }

        .contract-label {
            font-size: 10px;
            color: var(--primary-gold);
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .contract-address {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: white;
            word-break: break-all;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background: #2b2f36;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: 0.3s;
        }

        .social-icon:hover {
            background: var(--primary-gold);
            color: black;
            transform: translateY(-3px);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary-gold);
            color: black;
        }

        .btn-primary:hover {
            background: #ffcc4a;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--text-gray);
            color: white;
        }

        .btn-outline:hover {
            border-color: white;
            background: rgba(255,255,255,0.05);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-gray);
        }
    </style>
</head>
<body>

<div class="hero-card">
    <!-- استخدام المسار النسبي للصورة لأنها في نفس المستودع -->
    <img src="logo.png" alt="KOGE Network" class="logo">
    
    <h1>KOGE Network</h1>
    <p class="tagline">The Next Generation of Governance & Utility</p>

    <div class="contract-box" onclick="copyContract()">
        <span class="contract-label">Official Contract Address</span>
        <span class="contract-address" id="addr">0xe6df05CC6F17A36B247eddC22fe3b9cFCcE91714</span>
    </div>

    <div class="social-links">
        <a href="https://t.me/koge_network_official" class="social-icon" title="Telegram"><i class="fab fa-telegram-plane"></i></a>
        <a href="https://x.com/KOGENetworoc" class="social-icon" title="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="https://www.facebook.com/61593243962449" class="social-icon" title="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="social-icon" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" class="social-icon" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    </div>

    <div class="action-buttons">
        <a href="https://bscscan.com/token/0xe6df05CC6F17A36B247eddC22fe3b9cFCcE91714" target="_blank" class="btn btn-primary">
            <i class="fas fa-search"></i> View on BscScan
        </a>
        <!-- سيتم ربط هذا الزر بملف الـ PDF بعد رفعه -->
        <a href="koge_whitepaper.pdf" class="btn btn-outline">
            <i class="fas fa-file-pdf"></i> Read Whitepaper
        </a>
    </div>

    <footer>
        &copy; 2026 KOGE Network. All rights reserved.
    </footer>
</div>

<script>
    function copyContract() {
        const addr = document.getElementById('addr').innerText;
        navigator.clipboard.writeText(addr);
        alert('Contract Address Copied!');
    }
</script>

</body>
</html>
